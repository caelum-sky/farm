services:
  app:
    build:
      context: .
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY:?Set APP_KEY before deployment}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:?Set HTTPS APP_URL before deployment}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS before deployment}
      LOG_CHANNEL: stack
      LOG_STACK: stderr
      LOG_LEVEL: info
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: farmbridge
      DB_USERNAME: farmbridge
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD before deployment}
      CACHE_STORE: redis
      SESSION_DRIVER: database
      SESSION_SECURE_COOKIE: "true"
      QUEUE_CONNECTION: redis
      QUEUE_AFTER_COMMIT: "true"
      REDIS_HOST: redis
      API_TOKEN_TTL_MINUTES: ${API_TOKEN_TTL_MINUTES:-1440}
      WEBHOOK_REQUIRE_SIGNATURES: "true"
      TRUSTED_IMAGE_HOSTS: ${TRUSTED_IMAGE_HOSTS:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?Set STRIPE_WEBHOOK_SECRET before deployment}
      RUN_MIGRATIONS: "true"
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD before deployment}
    ports:
      - "8080:8080"
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: .
    command: php artisan queue:work redis --sleep=1 --tries=3 --timeout=90
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY:?Set APP_KEY before deployment}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:?Set HTTPS APP_URL before deployment}
      LOG_CHANNEL: stack
      LOG_STACK: stderr
      LOG_LEVEL: info
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: farmbridge
      DB_USERNAME: farmbridge
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD before deployment}
      CACHE_STORE: redis
      SESSION_DRIVER: database
      QUEUE_CONNECTION: redis
      QUEUE_AFTER_COMMIT: "true"
      REDIS_HOST: redis
    security_opt:
      - no-new-privileges:true
    depends_on:
      - app
      - redis

  scheduler:
    build:
      context: .
    command: sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY:?Set APP_KEY before deployment}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:?Set HTTPS APP_URL before deployment}
      LOG_CHANNEL: stack
      LOG_STACK: stderr
      LOG_LEVEL: info
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: farmbridge
      DB_USERNAME: farmbridge
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD before deployment}
      CACHE_STORE: redis
      SESSION_DRIVER: database
      QUEUE_CONNECTION: redis
      QUEUE_AFTER_COMMIT: "true"
      REDIS_HOST: redis
    security_opt:
      - no-new-privileges:true
    depends_on:
      - app

  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: farmbridge
      POSTGRES_USER: farmbridge
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD before deployment}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farmbridge -d farmbridge"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
  redis-data:
