<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FarmBridge Signup Preview</title>
    <link rel="stylesheet" href="/assets/app.css">
</head>
<body class="auth-page">
    <header class="site-header" data-header>
        <a class="brand" href="/" aria-label="FarmBridge home"><span class="brand-mark">FB</span><span>FarmBridge</span></a>
        <button class="nav-toggle" type="button" aria-label="Open navigation" aria-expanded="false" data-nav-toggle><span></span><span></span><span></span></button>
        <nav class="site-nav" data-site-nav><a href="/marketplace">Marketplace</a><a href="/login">Login</a><a class="nav-pill" href="/signup">Sign Up</a></nav>
    </header>
    <main>
        <section class="auth-shell">
            <div class="auth-art">
                <img src="/assets/farmer-market.png" alt="Farmer preparing produce for market">
                <div><span class="eyebrow">Join the network</span><h1>Bring your equipment, goods, and local farm supply online.</h1></div>
            </div>
            <form class="auth-form" data-signup-form data-preview-form>
                <div class="form-heading"><span class="eyebrow">Sign up</span><h2>Create your account</h2></div>
                <div class="form-grid">
                    <label><span>Full name</span><input type="text" name="name" autocomplete="name" required></label>
                    <label><span>Farm or business</span><input type="text" name="farm_name"></label>
                </div>
                <label><span>Email address</span><input type="email" name="email" autocomplete="email" required></label>
                <div class="form-grid">
                    <label><span>Phone</span><input type="tel" name="phone" autocomplete="tel"></label>
                    <label><span>Location</span><input type="text" name="location" required></label>
                </div>
                <label>
                    <span>Account type</span>
                    <select name="role" required>
                        <option value="farmer">Farmer</option>
                        <option value="seller">Seller</option>
                        <option value="buyer">Buyer</option>
                        <option value="cooperative">Cooperative</option>
                    </select>
                </label>
                <div class="form-grid">
                    <label><span>Password</span><input type="password" name="password" autocomplete="new-password" required data-password></label>
                    <label><span>Confirm password</span><input type="password" name="password_confirmation" autocomplete="new-password" required data-password-confirm></label>
                </div>
                <p class="password-hint" data-password-hint>Use at least 8 characters.</p>
                <button class="button primary full" type="submit">Create Account</button>
                <p class="form-alt">Already have an account? <a href="/login">Login</a></p>
            </form>
        </section>
    </main>
    <footer class="site-footer">
        <div><strong>FarmBridge</strong><span>Equipment, harvests, and local farm trade in one place.</span></div>
        <div class="footer-links"><a href="/">Browse</a><a href="/signup">Join</a></div>
    </footer>
    <script src="/assets/app.js" defer></script>
</body>
</html>
