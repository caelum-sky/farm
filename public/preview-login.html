<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FarmBridge Login Preview</title>
    <link rel="stylesheet" href="/assets/app.css">
</head>
<body class="auth-page">
    <header class="site-header" data-header>
        <a class="brand" href="/" aria-label="FarmBridge home"><span class="brand-mark">FB</span><span>FarmBridge</span></a>
        <button class="nav-toggle" type="button" aria-label="Open navigation" aria-expanded="false" data-nav-toggle><span></span><span></span><span></span></button>
        <nav class="site-nav" data-site-nav><a href="/marketplace">Marketplace</a><a href="/login">Login</a><a class="nav-pill" href="/signup">Sign Up</a></nav>
    </header>
    <main>
        <section class="auth-shell">
            <div class="auth-art">
                <img src="/assets/hero-farm-market.png" alt="FarmBridge marketplace">
                <div><span class="eyebrow">Welcome back</span><h1>Manage listings, messages, rentals, and harvest orders.</h1></div>
            </div>
            <form class="auth-form" data-preview-form>
                <div class="form-heading"><span class="eyebrow">Login</span><h2>Open your FarmBridge account</h2></div>
                <label><span>Email address</span><input type="email" name="email" autocomplete="email" required></label>
                <label><span>Password</span><input type="password" name="password" autocomplete="current-password" required></label>
                <label class="check-line"><input type="checkbox" name="remember" value="1"><span>Remember me</span></label>
                <button class="button primary full" type="submit">Login</button>
                <p class="form-alt">New to FarmBridge? <a href="/signup">Create an account</a></p>
            </form>
        </section>
    </main>
    <footer class="site-footer">
        <div><strong>FarmBridge</strong><span>Equipment, harvests, and local farm trade in one place.</span></div>
        <div class="footer-links"><a href="/">Browse</a><a href="/signup">Join</a></div>
    </footer>
    <script src="/assets/app.js" defer></script>
</body>
</html>
